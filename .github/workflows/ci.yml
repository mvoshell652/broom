name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Tests and builds with Apple's Command Line Tools only, the toolchain `xcode-select --install` gives you, so neither
  # installing nor developing Broom needs Xcode.
  test:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          test -d "$DEVELOPER_DIR" || { echo "No Command Line Tools at $DEVELOPER_DIR"; exit 1; }
          pkgutil --pkg-info=com.apple.pkg.CLTools_Executables | grep version || true
          xcrun --show-sdk-version
          swift --version
      - name: Find Swift the way install.sh does
        run: xcrun --find swift
      - name: Where Swift Testing is
        run: find "$DEVELOPER_DIR" \( -name Testing.framework -o -name 'libTestingMacros.dylib' -o -name 'Testing.swiftmodule' \) 2>/dev/null | head
      - name: Build and test
        run: scripts/test.sh
      - name: Build the app
        run: scripts/make-app.sh build
